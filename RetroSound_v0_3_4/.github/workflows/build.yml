name: Build RetroSound
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  windows:
    name: Windows x86 portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x86 portable build
        run: cmake -S windows -B build-win -A Win32 -DCMAKE_BUILD_TYPE=Release
      - name: Build Release
        run: cmake --build build-win --config Release --parallel 2
      - name: Show executable info
        shell: pwsh
        run: Get-Item build-win/Release/RetroSoundSender.exe | Format-List Name,Length,LastWriteTime
      - uses: actions/upload-artifact@v4
        with:
          name: RetroSound-Windows-x86-v0.3.4-debug
          path: |
            build-win/Release/RetroSoundSender.exe
            build-win/Release/RetroSoundProbe.exe
          if-no-files-found: error

  android:
    name: Android 4.2+
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RetroSound-Android-v0.3.4
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
